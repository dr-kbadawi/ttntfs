# xcodegen spec. Regenerate the project with:  xcodegen generate  (run in fskit/)
name: NTFS
options:
  bundleIdPrefix: ch.techtag
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_VERSION: "5.0"          # language mode 5: FSKit classes are not Sendable-annotated
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "$(NTFS_TEAM_ID)"
    ENABLE_HARDENED_RUNTIME: YES
    CLANG_WARN_DOCUMENTATION_COMMENTS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    # Version stamping. Defaults for a plain `xcodebuild`; scripts/package.sh
    # overrides all three from VERSION and git via scripts/version.sh. Both
    # Info.plists read them, and SettingsView shows them.
    MARKETING_VERSION: "0.4.1"
    CURRENT_PROJECT_VERSION: "0"
    TT_GIT_COMMIT: "xcode"
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      GCC_PREPROCESSOR_DEFINITIONS: DEBUG=1
    # Release is the shipping configuration: Developer ID + hardened runtime +
    # a secure timestamp, which is what notarization requires. The profiles are
    # Developer ID ones from the portal (Xcode's automatic signing only ever
    # makes development profiles), and the extension's is what authorizes the
    # managed FSKit entitlement and the app group container on macOS 15+.
    Release:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Developer ID Application"
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
      # Xcode otherwise injects com.apple.security.get-task-allow, which lets a
      # debugger attach; the notary service rejects any binary carrying it.
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

targets:
  NTFS:
    type: application
    platform: macOS
    sources:
      - path: NTFS
      - path: Shared
    dependencies:
      - target: NTFSExtension
        embed: true
    info:
      path: NTFS/Info.plist
      properties:
        CFBundleDisplayName: TT NTFS Native
        CFBundleName: TT NTFS Native
        LSUIElement: true                    # menu-bar app, no Dock icon
        LSApplicationCategoryType: public.app-category.utilities
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        TTGitCommit: "$(TT_GIT_COMMIT)"
        # GPL-2.0 s.1 and s.2(c): the copyright notice and the no-warranty
        # statement belong where the user can see them. COPYRIGHT has the rest.
        NSHumanReadableCopyright: "Copyright © 2026 TechTag GmbH. Free software under the GNU GPL v2; no warranty."
    # Deliberately NOT sandboxed. The app enables the FSKit module itself by
    # writing fskit_agent's list in the Apple-restricted group container and
    # restarting the agent; both are out of reach under the sandbox, and the
    # System Settings switch that would otherwise do it is broken on macOS 26
    # (see ModuleEnabler.swift). This rules out Mac App Store distribution,
    # which a module carrying a managed FSKit entitlement cannot use anyway.
    # The app group is kept so the shared preferences and mount-status.json
    # stay in the same container the (sandboxed) extension uses.
    entitlements:
      path: NTFS/NTFS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ch.techtag.ntfs
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.techtag.ntfs
        PRODUCT_NAME: TT NTFS Native
        INFOPLIST_KEY_LSUIElement: YES
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: "TT NTFS Native PP"

  NTFSExtension:
    type: extensionkit-extension
    platform: macOS
    sources:
      - path: NTFSExtension
      - path: Shared
      - path: Bridge
        excludes: ["ntfs_bdev_fskit.m"]
      # Compiled without clang modules: it includes ntfsport/bdev.h, whose kernel
      # compat types (struct rb_node) collide with Darwin's <sys/rbtree.h> when
      # the Darwin module is imported wholesale.
      - path: Bridge/ntfs_bdev_fskit.m
        compilerFlags: "-fno-modules"
      - path: ../core/stub/ntfscore_stub.c
        group: Stub
    info:
      path: NTFSExtension/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        TTGitCommit: "$(TT_GIT_COMMIT)"
        NSHumanReadableCopyright: "Copyright © 2026 TechTag GmbH. Free software under the GNU GPL v2; no warranty."
        CFBundleDisplayName: TT NTFS Native
        CFBundleName: NTFSExtension
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.fskit.fsmodule
          FSShortName: ttntfs
          FSSupportsBlockResources: true
          FSSupportsKernelOffloadedIO: false
          FSSupportsServerURLs: false
          FSActivateOptionSyntax:
            shortOptions: "o:"
          FSCheckOptionSyntax:
            shortOptions: "qynfp"
          FSFormatOptionSyntax:
            shortOptions: "v:c:"
          FSMediaTypes:
            Windows_NTFS:
              FSMediaProperties:
                "Content Hint": Windows_NTFS
                Leaf: true
              FSProbeOrder: 500
            EBD0A0A2-B9E5-4433-87C0-68B6B72699C7:
              FSMediaProperties:
                "Content Hint": EBD0A0A2-B9E5-4433-87C0-68B6B72699C7
                Leaf: true
              FSProbeOrder: 1500
            # GPT Windows Recovery. Also NTFS, and nothing on macOS mounts it
            # today -- Apple's driver is not offered it either -- so without
            # this the app could list such a partition but never mount it.
            # Probed after the data partition: it is the rarer case.
            DE94BBA4-06D1-4D40-A16A-BFD50179D6AC:
              FSMediaProperties:
                "Content Hint": DE94BBA4-06D1-4D40-A16A-BFD50179D6AC
                Leaf: true
              FSProbeOrder: 2500
            Partitionless:
              FSMediaProperties:
                Leaf: true
                Whole: true
              FSProbeOrder: 3500
          FSPersonalities:
            TTNTFS:
              FSName: "TT NTFS Native"
              FSSubType: 0
              FSFormatContentMask: Windows_NTFS
              FSFormatMinimumSize: 1048576
              FSFormatMaximumSize: 281474976710656
    entitlements:
      path: NTFSExtension/NTFSExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.developer.fskit.fsmodule: true
        com.apple.security.application-groups:
          - group.ch.techtag.ntfs
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.techtag.ntfs.extension
        PRODUCT_NAME: NTFSExtension
        SWIFT_OBJC_BRIDGING_HEADER: Bridge/NTFSExtension-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/../core/include"
          - "$(SRCROOT)/../platform/include"
          - "$(SRCROOT)/Bridge"
        CLANG_ENABLE_OBJC_ARC: YES
        # Core selection, see Config/Shared.xcconfig (NTFS_CORE_MODE = stub | real)
        EXCLUDED_SOURCE_FILE_NAMES: "$(NTFS_CORE_EXCLUDE_$(NTFS_CORE_MODE))"
        OTHER_LDFLAGS: "$(inherited) $(NTFS_CORE_LDFLAGS_$(NTFS_CORE_MODE))"
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: "TT NTFS Native Ext PP"

  # Unit tests. A logic-test bundle with no host application: the pure code
  # worth testing is split across the app and the extension, an ExtensionKit
  # extension cannot host unit tests, and hosting them in the app would run
  # them against the app group's real mount-status.json. So the files under
  # test are compiled into the bundle instead, over the stub core -- nothing
  # here calls into libntfscore, so the tests build without a CMake build
  # having been done.
  NTFSTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: NTFSTests
      - path: Shared
      - path: NTFSExtension/Options.swift
      - path: NTFSExtension/Errors.swift          # defines `log`, which Options uses
      - path: NTFS/DiskInventory.swift
      - path: NTFS/ModuleEnabler.swift            # DiskInventory.refresh() calls into it
      - path: NTFS/SharedSettings.swift
      - path: ../core/stub/ntfscore_stub.c
        group: Stub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.techtag.ntfs.tests
        PRODUCT_NAME: NTFSTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: Bridge/NTFSExtension-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/../core/include"
          - "$(SRCROOT)/../platform/include"
          - "$(SRCROOT)/Bridge"
        CLANG_ENABLE_OBJC_ARC: YES
        # Test bundles are loaded by xctest, never distributed: sign locally and
        # leave the app's and the extension's signing alone.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        ENABLE_HARDENED_RUNTIME: NO
        DEVELOPMENT_TEAM: ""

schemes:
  NTFS:
    build:
      targets:
        NTFS: all
        NTFSExtension: all
    run:
      config: Debug
    archive:
      config: Release

  # Separate from the NTFS scheme on purpose: running the tests must not need
  # ../build/libntfscore.a, which only exists after a CMake build.
  NTFSTests:
    build:
      targets:
        NTFSTests: [test]
    test:
      config: Debug
      targets:
        - NTFSTests
